name: Release to ClawHub

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Package skill
        run: ./scripts/package-clawhub.sh "${{ steps.version.outputs.version }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/shopprentice-${{ steps.version.outputs.version }}.skill
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install ClawHub CLI
        run: npm i -g clawhub

      - name: Publish to ClawHub
        env:
          CLAWHUB_TOKEN: ${{ secrets.OPENCLAW_TOKEN }}
        run: |
          clawhub auth login --token "$CLAWHUB_TOKEN"
          clawhub skill publish dist/shopprentice-${{ steps.version.outputs.version }}.skill --slug woodworking --version "${{ steps.version.outputs.version }}" --tags latest
